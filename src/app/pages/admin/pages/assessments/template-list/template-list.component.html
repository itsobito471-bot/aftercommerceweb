<div class="page-header animate-header">
    <div class="header-content">
        <div class="page-label-wrap">
            <span class="page-label-root">Templates</span>
            <span class="page-label-sep">›</span>
            <span class="page-label-current">Assessment Templates</span>
        </div>
        <h1 class="page-title">Assessment Templates</h1>
        <p class="page-subtitle">Manage reusable quizzes and surveys for your curriculum.</p>
    </div>

    <!-- Create Button styled with your global .btn-primary -->
    <button (click)="createNewTemplate()" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create Template</span>
    </button>
</div>

<!-- Kept for spacing/consistency with your other pages -->
<div class="metrics-grid">
</div>

<div class="glass-card animate-card-enter">
    <div class="table-toolbar">
        <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="glass-input search-input" placeholder="Search templates..."
                [(ngModel)]="searchQuery" (keyup.enter)="onSearch()">
        </div>
    </div>

    <!-- FIX: Removed y: '60vh' from nzScroll. Global CSS handles it cleanly now! -->
    <nz-table #templateTable 
              [nzData]="templatesList" 
              [nzLoading]="isLoading" 
              [nzFrontPagination]="false"
              [nzTotal]="totalItems"
              [nzPageIndex]="pageIndex"
              [nzPageSize]="pageSize"
              (nzQueryParams)="onQueryParamsChange($event)"
              [nzScroll]="{ x: '800px' }"
              class="glass-nz-table">
        <thead>
            <tr>
                <th nzWidth="30%">Template Title</th>
                <th nzWidth="15%">Type</th>
                <th nzWidth="15%">Duration</th>
                <th nzWidth="15%">Passing Score</th>
                <!-- FIX: Used nzAlign for perfect Ng-Zorro right-alignment -->
                <th nzWidth="25%" nzAlign="right">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let data of templateTable.data">
                <td>
                    <span class="fw-600">{{ data.title }}</span>
                </td>
                
                <td>
                    <span class="glass-badge" [ngClass]="data.type === 'QUIZ' ? 'glass-badge--active' : 'glass-badge--inactive'">
                        {{ data.type }}
                    </span>
                </td>

                <td class="text-muted">
                    <span *ngIf="data.duration_minutes > 0"><i nz-icon nzType="clock-circle"></i> {{ data.duration_minutes }} mins</span>
                    <span *ngIf="!data.duration_minutes || data.duration_minutes === 0">Unlimited</span>
                </td>

                <td class="text-muted">
                    <span *ngIf="data.passing_score">{{ data.passing_score }}%</span>
                    <span *ngIf="!data.passing_score">N/A</span>
                </td>

                <!-- FIX: Wrapped buttons in a flexbox for perfect vertical centering and spacing -->
                <td nzAlign="right">
                    <div style="display: flex; justify-content: flex-end; gap: 8px; align-items: center;">
                        <!-- Edit Settings -->
                        <button class="action-btn action-edit" nz-tooltip nzTooltipTitle="Edit Settings" (click)="editTemplateSetup(data._id)">
                            <span nz-icon nzType="setting" nzTheme="outline"></span>
                        </button>
                        
                        <!-- Build Questions (Now uses 'Growth Green' from your brand book) -->
                        <button class="action-btn action-edit" style="color: #0F9D58; background: rgba(15, 157, 88, 0.1);" nz-tooltip nzTooltipTitle="Manage Questions" (click)="openQuestionBuilder(data._id)">
                            <span nz-icon nzType="form" nzTheme="outline"></span>
                        </button>
                        
                        <!-- Delete -->
                        <button class="action-btn action-delete" nz-tooltip nzTooltipTitle="Delete" (click)="deleteTemplate(data._id)">
                            <span nz-icon nzType="delete" nzTheme="outline"></span>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </nz-table>
</div>
